name: Android CI
run-name: 'Cold comparison · ${{ inputs.mode }} · workers ${{ inputs.workers }}'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '전체 직렬 기준 또는 검증 종류별 무료 환경 분리'
        type: choice
        options: ['full', 'separate']
        default: 'full'
      workers:
        description: '일반 빌드 worker 수 (비교 전용·병합 금지)'
        type: choice
        options: ['2', '4']
        default: '2'

permissions:
  contents: read

concurrency:
  group: android-cold-comparison-${{ github.ref }}
  cancel-in-progress: false

env:
  MONIT_PRODUCT_SHA: 43ba391a3801f502321052c62032bf7e2d4488fc
  MONIT_WORKERS: ${{ inputs.workers }}

defaults:
  run:
    working-directory: product

jobs:
  validation:
    name: 'cold / ${{ matrix.scope }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scope: ${{ fromJSON(inputs.mode == 'separate' && '["independent","assemble","tests","lint"]' || '["all"]') }}
    env:
      MONIT_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 43ba391a3801f502321052c62032bf7e2d4488fc
          path: product
          fetch-depth: 0
      - name: Verify fixed product revision
        run: test "$(git rev-parse HEAD)" = "$MONIT_PRODUCT_SHA"
      - name: Prepare empty Gradle User Home
        run: |
          test ! -e "$RUNNER_TEMP/monit-cold-gradle-home"
          mkdir "$RUNNER_TEMP/monit-cold-gradle-home"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/monit-cold-gradle-home" >> "$GITHUB_ENV"
          echo 'MONIT_COLD_HOME_VERIFIED=true' >> "$GITHUB_ENV"
      - name: Check documentation
        shell: pwsh
        run: ./scripts/Test-AiDocs.ps1
      - name: Check diff whitespace
        run: node .github/scripts/ci-impact.mjs --check-diff
      - name: Test validation classifier
        run: node --test .github/scripts/ci-impact.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # No GitHub cache reads/writes or artifact uploads in either comparison.
          cache-disabled: true
      - name: Cold full validation and profile
        run: node ../harness/.github/scripts/ci-cold-benchmark.mjs
  build:
    needs: validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every validation job
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
