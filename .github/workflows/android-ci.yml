name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation
        shell: pwsh
        run: ./scripts/Test-AiDocs.ps1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check independent UI components
        run: |
          for component in button chip textfield; do
            bash ./gradlew :core:designsystem:compileDebugKotlin --init-script scripts/verify-component.init.gradle.kts "-Pmonit.component=$component" -Pkotlin.incremental=false --project-cache-dir "core/designsystem/build/component-compilation/project-cache/$component" --console=plain
          done
      - name: Build, unit tests and lint
        run: bash ./gradlew :core:model:test assembleDebug testDebugUnitTest lintDebug --console=plain
